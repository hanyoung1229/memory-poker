<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1714" />
  <meta name="description" content="16장의 위치를 기억하고, 공용 카드 3장으로 포커 족보를 완성하세요." />
  <title>메모리 포커 | MEMORY POKER</title>
  <link rel="stylesheet" href="/styles.css?v=1.5.2" />
</head>
<body>
  <div class="background-glow" aria-hidden="true"></div>
  <main id="app" class="shell" aria-live="polite">
    <div class="loading">카드를 섞고 있습니다<span class="loading-dots">...</span></div>
  </main>
  <aside class="music-dock" id="musicDock" aria-label="배경 음악">
    <div class="music-dock-actions">
      <button type="button" class="music-button" id="musicToggle" aria-pressed="false">🎵 음악 켜기</button>
      <button type="button" class="music-button music-gear" id="musicSettingsToggle" aria-expanded="false" aria-controls="musicSettings">⚙ 조절</button>
    </div>
    <div class="music-now" id="musicNow" aria-live="polite">음악 대기</div>
    <div class="music-settings" id="musicSettings" hidden>
      <label for="musicTrack">재생 음악</label>
      <select id="musicTrack">
        <option value="auto">자동 전환 · 게임 단계별</option>
        <option value="covert">Covert Affair</option>
        <option value="bossa">Bossa Antigua</option>
        <option value="night">Night on the Docks - Trumpet</option>
      </select>
      <div class="music-volume-label"><label for="musicVolume">볼륨</label><span id="musicVolumeValue">25%</span></div>
      <input type="range" id="musicVolume" min="0" max="100" step="5" value="25" />
      <label class="music-loop-label"><input type="checkbox" id="musicLoop" checked /> 반복 재생</label>
      <div class="music-license">음악: Kevin MacLeod · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a><div class="music-credits"><a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1100795" target="_blank" rel="noopener">Covert Affair</a> · <a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1700069" target="_blank" rel="noopener">Bossa Antigua</a> · <a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1100136" target="_blank" rel="noopener">Night on the Docks - Trumpet</a></div></div>
    </div>
  </aside>
  <div class="version-stamp" aria-label="메모리 포커 버전 1.5.2">MEMORY POKER · v1.5.2</div>
  <div id="toast" class="toast" role="status" aria-live="assertive"></div>
  <script src="/app.js?v=1.5.2" defer></script>
</body>
</html>
